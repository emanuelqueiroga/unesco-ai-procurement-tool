<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Toast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
html,body{margin:0;background:var(--surface-1);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
*{box-sizing:border-box}
.row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap;padding:var(--space-4)}
.col{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.toast{display:inline-flex;align-items:center;gap:var(--space-3);margin:var(--space-4);padding:var(--space-3) var(--space-4);background:var(--ink);color:var(--surface-1);border-radius:var(--radius-md);box-shadow:var(--shadow-md);font-size:14px}
.toast a{color:inherit;font-weight:600}
</style></head>
<body>

<div class="toast" role="status">Caso exportado como tutor-matematica.json <a href="#">Desfazer</a></div>

</body></html>
