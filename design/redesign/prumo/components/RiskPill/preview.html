<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>RiskPill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
html,body{margin:0;background:var(--surface-1);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
*{box-sizing:border-box}
.row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap;padding:var(--space-4)}
.col{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 var(--space-3);border-radius:var(--radius-pill);font-size:13px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.lim{background:var(--ok-bg);color:var(--ok)} .mod{background:var(--warn-bg);color:var(--warn)} .ele{background:var(--high-bg);color:var(--high)} .cri{background:var(--crit-bg);color:var(--crit)} .inf{background:var(--info-bg);color:var(--info)}
</style></head>
<body>

<div class="row">
  <span class="pill lim"><i></i>Limitado</span>
  <span class="pill mod"><i></i>Moderado</span>
  <span class="pill ele"><i></i>Elevado</span>
  <span class="pill cri"><i></i>Crítico</span>
  <span class="pill inf"><i></i>Orientação</span>
</div>

</body></html>
