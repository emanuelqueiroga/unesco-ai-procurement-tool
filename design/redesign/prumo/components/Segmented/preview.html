<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Segmented</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
html,body{margin:0;background:var(--surface-1);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
*{box-sizing:border-box}
.row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap;padding:var(--space-4)}
.col{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.seg{display:inline-flex;border:1px solid var(--line-control);border-radius:var(--radius-md);overflow:hidden}
.seg button{height:44px;padding:0 var(--space-4);border:0;border-right:1px solid var(--line-control);background:var(--surface-1);font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary);font-weight:600}
.q{font-size:15px;margin-bottom:var(--space-2)}
</style></head>
<body>

<div class="col">
  <div class="q">Sua rede tem uma equipe responsável por IA na educação?</div>
  <div class="seg" role="group" aria-label="Resposta">
    <button aria-pressed="false">Sim</button><button aria-pressed="true">Em parte</button><button aria-pressed="false">Não</button><button aria-pressed="false">Não sei</button>
  </div>
</div>

</body></html>
