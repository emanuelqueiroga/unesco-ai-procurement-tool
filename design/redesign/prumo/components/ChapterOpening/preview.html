<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ChapterOpening</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
html,body{margin:0;background:var(--surface-1);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
*{box-sizing:border-box}
.row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap;padding:var(--space-4)}
.col{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.open{padding:var(--space-7) var(--space-6);max-width:720px;display:flex;flex-direction:column;gap:var(--space-4)}
.kicker{font-size:13px;color:var(--muted)}
h1{margin:0;font-family:var(--font-serif);font-size:48px;line-height:54px;font-weight:600}
.guide{font-family:var(--font-serif);font-size:22px;line-height:30px;color:var(--ink-2);font-style:italic;max-width:600px}
p{margin:0;font-size:16px;line-height:24px;color:var(--ink-2);max-width:600px}
.meta{display:flex;gap:var(--space-5);font-size:13px;color:var(--muted)}
.meta b{color:var(--ink)}
.phase{width:48px;height:6px;border-radius:var(--radius-pill);background:var(--phase-2)}
</style></head>
<body>

<div class="open">
  <div class="phase"></div>
  <div class="kicker">Capítulo 2 de 4</div>
  <h1>O teste</h1>
  <div class="guide">Como aprender o máximo sobre a ferramenta, com o menor risco e o menor custo?</div>
  <p>Antes de contratar para a rede inteira, vale testar em poucas escolas. No fim deste capítulo aparece o primeiro número do plano: quanto custa testar.</p>
  <div class="meta"><span><b>11</b> perguntas</span><span><b>~8</b> minutos</span></div>
</div>

</body></html>
