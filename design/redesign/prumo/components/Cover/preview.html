<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prumo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
html,body{margin:0;background:var(--surface-1);color:var(--ink);font-family:var(--font-sans)}
.cover{position:relative;width:960px;height:300px;overflow:hidden}
.cover svg{position:absolute;inset:0}
.p1{fill:var(--phase-1)} .p2{fill:var(--phase-2)} .p3{fill:var(--phase-3)} .p4{fill:var(--phase-4)}
.band{rx:var(--radius-sm)}
.rule{stroke:var(--line-control);stroke-width:1.5}
.bob{fill:var(--accent)}
.name{position:absolute;left:48px;top:96px;margin:0;font-family:var(--font-serif);font-weight:600;font-size:120px;line-height:.92;color:var(--ink)}
.tag{position:absolute;left:52px;top:228px;margin:0;font-size:14px;line-height:18px;color:var(--muted);max-width:420px}
</style></head>
<body>
<div class="cover">
<!--
blocks: four bands in phase-1 → phase-4, each 48 (space-7) tall, gap 8 (space-2), corners radius-sm; the darkest is primary
arrangement: a staggered stack stepping right by 48 (space-7) and bleeding off the right edge — the four chapters, each starting where the last left off
pattern: the literal motif, a plumb line — ONE hairline rule (line-control) crossing the bands with a disc in accent at its end; chosen because the system is named after the plumb line and its one accent marks "what just changed"
scales: space-7, space-2, radius-sm; disc r = 12 (space-3)
-->
<svg viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Prumo: quatro faixas escalonadas, do claro ao escuro, cruzadas por uma linha de prumo">
  <rect class="p1 band" x="480" y="42" width="520" height="48"/>
  <rect class="p2 band" x="528" y="98" width="480" height="48"/>
  <rect class="p3 band" x="576" y="154" width="440" height="48"/>
  <rect class="p4 band" x="624" y="210" width="400" height="48"/>
  <line class="rule" x1="760" y1="16" x2="760" y2="270"/>
  <circle class="bob" cx="760" cy="276" r="12"/>
</svg>
<h1 class="name">Prumo</h1>
<p class="tag">Do contexto ao plano de contratação, no prumo.</p>
</div>
</body></html>
